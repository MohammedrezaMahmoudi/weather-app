<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آب‌وهوا | Weather</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-animation">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="app">
      <header class="app-header">
        <h1>🌤️ آب‌وهوا</h1>
        <p class="subtitle">اسم شهرت رو بنویس</p>
      </header>

      <form id="search-form" class="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="مثلاً: تهران، London، Tokyo"
          required
          autocomplete="off"
        />
        <button type="submit">
          <span class="btn-text">جستجو</span>
          <span class="btn-icon">🔍</span>
        </button>
      </form>

      <div id="error" class="error hidden">
        <span class="error-icon">⚠️</span>
        <p id="error-text">شهر پیدا نشد!</p>
      </div>

      <!-- گرید کارت‌ها (لودینگ هم داخلش میاد) -->
      <div id="cards-grid" class="cards-grid"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
